    <!-- Profile Viewbox -->
    <div class="profile-modal" id="profileModal">
      <div class="profile-header">
        <div class="profile-title">Profile Information</div>
        <div class="profile-controls">
          <button
            type="button"
            class="profile-control-btn"
            id="collapseProfileBtn"
            title="Collapse"
          >
            <i
              class="bi bi-chevron-down profile-chevron-icon"
              id="profileCollapseIcon"
            ></i>
          </button>
          <button
            type="button"
            class="profile-control-btn"
            id="closeProfileBtn"
            title="Close"
          >
            <i class="bi bi-x"></i>
          </button>
        </div>
      </div>
  
      <form class="profile-form" id="profileContent">
        <div class="row g-2">
          <!-- Firstname -->
          <div class="col-12 col-md-6">
            <label for="firstname">Firstname</label>
            <input
              type="text"
              class="form-control"
              id="firstname"
              name="firstname"
              value="Admin"
            />
          </div>
          <!-- Email -->
          <div class="col-12 col-md-6">
            <label for="email">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              value="farovontechnology@gmail.com"
            />
          </div>
          <!-- Lastname -->
          <div class="col-12 col-md-6">
            <label for="lastname">Lastname</label>
            <input
              type="text"
              class="form-control"
              id="lastname"
              name="lastname"
              value="Farovon"
            />
          </div>
          <!-- Password -->
          <div class="col-12 col-md-6">
            <label for="password">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              value="12345"
            />
          </div>
          <!-- Username -->
          <div class="col-12 col-md-6">
            <label for="username">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              value="Admin01"
            />
          </div>
          <!-- Confirm Password -->
          <div class="col-12 col-md-6">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              value="12345"
            />
          </div>
          <!-- Active Until -->
          <div class="col-12 col-md-6">
            <label for="activeUntil">Active Until</label>
            <input
              type="datetime-local"
              class="form-control"
              id="activeUntil"
              name="activeUntil"
              value="2026-12-31T01:11"
            />
          </div>
          <!-- Spacer -->
          <div class="w-50"></div>
          <!-- Phone -->
          <div class="col-12 col-md-6">
            <label for="phone">Phone</label>
            <input
              type="text"
              class="form-control"
              id="phone"
              name="phone"
              value="0822123456"
            />
          </div>
        </div>
        <!-- Form Actions -->
        <div class="profile-form-actions">
          <button type="button" class="profile-btn profile-btn-cancel">
            Cancel
          </button>
          <button type="submit" class="profile-btn profile-btn-submit">
            Submit
          </button>
        </div>
